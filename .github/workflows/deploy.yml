name: Deploy to Production

# Runs automatically every time you push code to the main branch
on:
  push:
    branches:
      - main

jobs:
  # ── Step 1: Check code quality ──────────────────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true  # Don't block deploy on type errors (ignoreBuildErrors is set)

      - name: Lint
        run: npm run lint
        continue-on-error: true  # Warn but don't block

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Log vulnerabilities but don't block

  # ── Step 2: Deploy to Cloudflare Workers ────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: quality  # Only deploy if quality checks pass
    environment: production

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build & Deploy to Cloudflare Workers
        run: npm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deployment success notification
        if: success()
        run: echo "✅ GJLottery deployed successfully to gjlottery.com"

      - name: Deployment failure notification
        if: failure()
        run: echo "❌ Deployment failed — check logs above"
