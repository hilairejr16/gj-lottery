<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Background: transparent so it works on dark header -->

  <!-- G letter badge -->
  <rect x="8" y="8" width="64" height="64" rx="14" fill="url(#goldGrad)"/>
  <text x="40" y="54" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900"
        text-anchor="middle" fill="#0D1520">GJ</text>

  <!-- Lottery text -->
  <text x="96" y="38" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900"
        fill="#FFFFFF" letter-spacing="1">LOTTERY</text>

  <!-- Tagline -->
  <text x="97" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="500"
        fill="#F5A623" letter-spacing="2">PARYAJ • JWÈT • LOTRI</text>

  <!-- Haitian flag accent line -->
  <rect x="96" y="64" width="50" height="3" rx="1.5" fill="#1B3A6B"/>
  <rect x="150" y="64" width="50" height="3" rx="1.5" fill="#CE1126"/>

  <!-- Star decorations -->
  <text x="282" y="30" font-size="14" fill="#F5A623" opacity="0.8">★</text>
  <text x="298" y="48" font-size="10" fill="#F5A623" opacity="0.5">★</text>
  <text x="275" y="52" font-size="8"  fill="#F5A623" opacity="0.4">★</text>

  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>
</svg>
