<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Outer ring - Haitian flag colors -->
  <circle cx="40" cy="40" r="38" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2"/>

  <!-- Inner badge -->
  <rect x="10" y="10" width="60" height="60" rx="14" fill="url(#goldGrad)"/>

  <!-- GJ text -->
  <text x="40" y="56" font-family="Arial Black, Arial, sans-serif" font-size="34"
        font-weight="900" text-anchor="middle" fill="#0D1520">GJ</text>

  <!-- Small stars -->
  <text x="13" y="22" font-size="8" fill="#0D1520" opacity="0.4">★</text>
  <text x="60" y="22" font-size="8" fill="#0D1520" opacity="0.4">★</text>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1B3A6B"/>
      <stop offset="100%" stop-color="#0D1520"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1B3A6B"/>
      <stop offset="50%"  stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#CE1126"/>
    </linearGradient>
  </defs>
</svg>
